<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TeamEngage</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/assets/app.css" />
    <style>
      /* teamengage-specific bits on top of bootstrap */
      .id { font-family: ui-monospace, monospace; font-weight: 600; }
      .badge-review { background: #6f42c1; color: #fff; }
      .badge-hold { background: #6d4c41; color: #fff; }
      /* formatted task markdown */
      .md-view { line-height: 1.5; overflow-wrap: anywhere; }
      .md-view h1 { font-size: 1.35rem; } .md-view h2 { font-size: 1.15rem; margin-top: 1.2rem; }
      .md-view h3 { font-size: 1.02rem; margin-top: 1rem; } .md-view h4, .md-view h5, .md-view h6 { font-size: .95rem; }
      .md-view pre { background: var(--bs-tertiary-bg); padding: .6rem .8rem; border-radius: .35rem; font-size: .8rem; }
      .md-view code { font-size: .85em; }
      .md-view pre code { color: inherit; }
      .md-view blockquote { border-left: 3px solid var(--bs-border-color); padding-left: .8rem; color: var(--bs-secondary-color); }
      .md-view .md-table { overflow-x: auto; } .md-view table { font-size: .85rem; width: auto; }
      .md-view li.md-task { list-style: none; margin-left: -1.2rem; }
      .md-view .md-ref { text-decoration: underline dotted; }
      .md-view .md-cont { margin-left: 1rem; }
      .md-view > :last-child { margin-bottom: 0; }
      .md-inline code { font-size: .85em; }
      /* domains */
      .domain-chip { color: #fff; font-weight: 500; cursor: default; }
      .domain-chip[title^="filter"], .board-col .domain-chip, .d-flex > .domain-chip { cursor: pointer; }
      .domain-chip.active { outline: 2px solid var(--bs-body-color); outline-offset: 1px; }
      .domain-chip.suggested { opacity: .8; border: 1px dashed #fff; }
      .chip-x { cursor: pointer; opacity: .8; } .chip-x:hover { opacity: 1; }
      .domain-input { width: 8rem; padding-top: 0; padding-bottom: 0; }
      .editable { cursor: pointer; border-bottom: 1px dotted var(--bs-border-color); }
      /* lists scroll inside their card/column — the page never gets miles long */
      .scroll-list { max-height: 46vh; overflow-y: auto; }
      /* fixed, narrow columns; long titles wrap inside the card */
      .board-col { width: 12rem; min-width: 12rem; max-width: 12rem; }
      .board-col .mini { padding: .4rem .5rem !important; }
      .board-col .mini .small { font-size: .78rem; line-height: 1.25; white-space: normal; overflow-wrap: anywhere; }
      .board-col .mini .id { font-size: .8rem; }
      .board-col .domain-chip { font-size: .62rem; padding: .15em .4em; }
      .board-col h3 { font-size: .75rem; }
      .board-list { max-height: calc(100vh - 13rem); overflow-y: auto; }
      .act-log { max-height: 70vh; overflow-y: auto; }
      /* action buttons keep one width so they don't jump around */
      .btn-act { width: 7.5rem; }
      .evt { font-family: ui-monospace, monospace; font-size: .78rem; padding: .2rem 0; border-bottom: 1px dashed var(--bs-border-color); }
      .claim-note { font-size: .78rem; color: var(--bs-warning-text-emphasis); }
      a.item { cursor: pointer; text-decoration: none; }
      .mini { cursor: pointer; }
      .mini:hover { border-color: var(--bs-primary); }
    </style>
  </head>
  <body>
    <nav class="navbar sticky-top border-bottom bg-body-tertiary px-3 py-2">
      <span class="navbar-brand fw-semibold me-3 py-0 d-flex align-items-center gap-2">
        <img src="/favicon.svg" alt="" width="26" height="26" />TeamEngage
      </span>
      <div id="nav" class="nav nav-pills nav-fill gap-1"></div>
      <button id="theme-toggle" class="btn btn-sm btn-outline-secondary ms-auto" title="toggle theme">◐</button>
    </nav>
    <main id="app" class="container-fluid px-4 py-3"></main>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
