<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TeamEngage</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/assets/app.css" />
    <style>
      /* teamengage-specific bits on top of bootstrap */
      .id { font-family: ui-monospace, monospace; font-weight: 600; }
      /* disabled actions keep pointer events (the title tooltip needs them —
         clicks stay suppressed by the attribute) and go neutral grey on
         hover instead of holding the accent colour */
      .btn:disabled { pointer-events: auto; cursor: not-allowed; }
      .btn:disabled:hover {
        color: var(--bs-secondary-color);
        background-color: var(--bs-secondary-bg);
        border-color: var(--bs-border-color);
      }
      .badge-review { background: #6f42c1; color: #fff; }
      .badge-hold { background: #6d4c41; color: #fff; }
      /* formatted task markdown */
      .md-view { line-height: 1.5; overflow-wrap: anywhere; }
      .md-view h1 { font-size: 1.35rem; } .md-view h2 { font-size: 1.15rem; margin-top: 1.2rem; }
      .md-view h3 { font-size: 1.02rem; margin-top: 1rem; } .md-view h4, .md-view h5, .md-view h6 { font-size: .95rem; }
      .md-view pre { background: var(--bs-tertiary-bg); padding: .6rem .8rem; border-radius: .35rem; font-size: .8rem; }
      .md-view code { font-size: .85em; }
      .md-view pre code { color: inherit; }
      .md-view blockquote { border-left: 3px solid var(--bs-border-color); padding-left: .8rem; color: var(--bs-secondary-color); }
      .md-view .md-table { overflow-x: auto; } .md-view table { font-size: .85rem; width: auto; }
      .md-view li.md-task { list-style: none; margin-left: -1.2rem; }
      .md-view .md-ref { text-decoration: underline dotted; }
      .md-view .md-cont { margin-left: 1rem; }
      .md-view > :last-child { margin-bottom: 0; }
      .md-inline code { font-size: .85em; }
      /* domains */
      .domain-chip { color: #fff; font-weight: 500; cursor: default; }
      .domain-chip[title^="filter"], .board-col .domain-chip, .d-flex > .domain-chip { cursor: pointer; }
      /* the filtered domain stays solid; sibling chips in the same group fade */
      .domain-chip { transition: opacity .15s; }
      .domain-chip.active { font-weight: 700; }
      *:has(> .domain-chip.active) > .domain-chip:not(.active) { opacity: .45; }
      .domain-chip.suggested { opacity: .8; border: 1px dashed #fff; }
      .chip-x { cursor: pointer; opacity: .8; } .chip-x:hover { opacity: 1; }
      .domain-input { width: 8rem; padding-top: 0; padding-bottom: 0; }
      .domain-color { width: 1.9rem; height: 1.35rem; padding: 0; border: 1px solid var(--bs-border-color); border-radius: .3rem; background: none; cursor: pointer; vertical-align: middle; }
      .domain-color::-webkit-color-swatch-wrapper { padding: 1px; }
      .domain-color::-webkit-color-swatch { border: 0; border-radius: .2rem; }
      .domain-color::-moz-color-swatch { border: 0; border-radius: .2rem; }
      .editable { cursor: pointer; border-bottom: 1px dotted var(--bs-border-color); }
      /* top nav: bootstrap nav-underline tabs kept quiet via the link colour vars */
      .navbar { min-height: 2.75rem; }
      #nav { --bs-nav-link-color: var(--bs-secondary-color); --bs-nav-link-hover-color: var(--bs-body-color); }
      /* inbox count (faint number) and sync badge (warning) sit after the label */
      #nav a[data-count]:not([data-count=""])::after { content: attr(data-count); color: var(--bs-tertiary-color); font-size: .7rem; font-variant-numeric: tabular-nums; font-weight: 400; }
      #nav a[data-badge]:not([data-badge=""])::after { content: attr(data-badge); font-size: .7em; color: var(--bs-warning); font-weight: 700; }
      #nav a[data-badge="●"]::after { content: ""; width: .38rem; height: .38rem; border-radius: 50%; background: var(--bs-warning); }
      /* status colours shared by triage dots, board headers and card hovers */
      .st-draft { --st: #6c757d; } .st-ready { --st: #0d6efd; }
      .st-hold { --st: #6d4c41; } .st-in_progress { --st: #ffc107; }
      .st-waiting { --st: #0dcaf0; } .st-in_review { --st: #6f42c1; }
      .st-done { --st: #198754; } .st-dropped { --st: #dc3545; }
      /* board: flat columns — a dot names the status; empty columns collapse to a strip */
      .board-cols { display: flex; gap: .75rem; overflow-x: auto; padding-bottom: .4rem; align-items: flex-start; }
      /* min-width:0 keeps the column pinned to its basis — a wide card meta row would
         otherwise push it wider (flex items default to min-content) */
      .board-col { flex: 0 0 14.25rem; min-width: 0; display: flex; flex-direction: column; min-height: 16rem; }
      .board-col.collapsed { flex: 0 0 2.1rem; min-height: 0; }
      .board-col.collapsed .col-hd { writing-mode: vertical-rl; height: auto; padding: .6rem 0; margin-bottom: 0; }
      .col-hd { display: flex; align-items: center; gap: .45rem; height: 1.75rem; padding: 0 .25rem; margin-bottom: .4rem; font-size: .75rem; font-weight: 600; }
      .col-hd .triage-st { color: var(--bs-body-color); font-weight: 600; }
      .col-hd .n { color: var(--bs-tertiary-color); font-weight: 500; font-variant-numeric: tabular-nums; }
      .col-body { display: flex; flex-direction: column; gap: .4rem;  border-radius: .5rem; padding: .4rem; flex: 1; max-height: calc(100vh - 14rem); overflow-y: auto; }
      .bcard { cursor: pointer; }
      [data-bs-theme="dark"] .bcard { background: var(--bs-tertiary-bg); }
      .bcard:hover { border-color: var(--bs-border-color); }
      .bcard .id { color: var(--bs-tertiary-color); font-size: .72rem; font-weight: 500; }
      .bcard .icon-btn { opacity: 0; transition: opacity .12s; }
      .bcard:hover .icon-btn, .bcard:focus-within .icon-btn, .bcard .icon-btn.on { opacity: 1; }
      .bcard-title { font-size: .8rem; line-height: 1.35; margin-bottom: .35rem; display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
      .bcard-meta { font-size: .7rem; color: var(--bs-tertiary-color); }
      .av { width: 1rem; height: 1rem; border-radius: 50%; background: var(--bs-secondary-bg); color: var(--bs-secondary-color); display: inline-grid; place-items: center; font-size: .56rem; font-weight: 600; border: 1px solid var(--bs-border-color); }
      .icon-btn { width: 1.35rem; height: 1.35rem; display: inline-grid; place-items: center; border: 0; border-radius: .25rem; color: var(--bs-tertiary-color); background: transparent; cursor: pointer; padding: 0; }
      .icon-btn:hover { background: var(--bs-secondary-bg); color: var(--bs-body-color); }
      /* item-page action bar: icon-only buttons, all the same square size — the tooltip is the label */
      .act-btn { width: 1.75rem; height: 1.75rem; padding: 0; display: inline-grid; place-items: center; }
      /* domain filter tags: hoverable, the active one stays highlighted */
      .triage-tag.clickable { cursor: pointer; }
      .triage-tag.clickable:hover, .triage-tag.on { color: var(--bs-body-color); }
      .triage-tag.on { box-shadow: inset 0 0 0 1px var(--bs-border-color); background: var(--bs-body-bg); }
      .triage-tag .n { color: var(--bs-tertiary-color); font-variant-numeric: tabular-nums; }
      /* action buttons keep one width so they don't jump around */
      .btn-act { width: 7.5rem; }
      .evt { font-family: ui-monospace, monospace; font-size: .78rem; padding: .2rem 0; border-bottom: 1px dashed var(--bs-border-color); }
      a.item { cursor: pointer; text-decoration: none; }
      /* item page: fixed label column next to editable fields */
      .item-lbl { display: inline-block; width: 4.6rem; flex: none; }
      /* item page: dependency chain strip — the "first concern" line.
         left edge takes the item's status colour (.st-*) */
      .chain { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; padding: .3rem .65rem; margin-top: .5rem;
               border-left: 3px solid var(--st, var(--bs-border-color)); background: var(--bs-tertiary-bg);
               border-radius: 0 .3rem .3rem 0; font-size: .83rem; }
      .chain .sep { color: var(--bs-tertiary-color); }
      /* unblocks policy as a quiet radio line (not a button group) */
      .pol-r { display: inline-flex; gap: .85rem; align-items: center; }
      .pol-r label { display: inline-flex; align-items: center; gap: .3rem; margin: 0; cursor: pointer; color: var(--bs-secondary-color); white-space: nowrap; }
      .pol-r label.on { color: var(--bs-body-color); }
      .pol-r input { margin: 0; }
      /* details disclosure: one quiet line that opens a panel */
      details.disc { margin-top: .45rem; }
      details.disc > summary, details.sec > summary { list-style: none; }
      details.disc > summary::-webkit-details-marker, details.sec > summary::-webkit-details-marker { display: none; }
      .disc-bar { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; font-size: .8rem; color: var(--bs-tertiary-color); cursor: pointer; user-select: none; }
      .disc-bar:hover .disc-t { color: var(--bs-body-color); }
      .disc-bar .caret, details.sec > summary .caret { color: var(--bs-tertiary-color); font-size: .68rem; width: .75rem; }
      .disc-bar .caret::before, details.sec > summary .caret::before { content: "▸"; }
      details[open] > summary .caret::before { content: "▾"; }
      .disc-panel { margin-top: .4rem; padding: .6rem .8rem; background: var(--bs-tertiary-bg); border: 1px solid var(--bs-border-color-translucent); border-radius: .35rem; }
      /* collapsed sections (notes / dependencies / history): a card the summary opens */
      details.sec { margin-top: .6rem; }
      details.sec > summary { display: flex; align-items: center; gap: .5rem; padding: .45rem .75rem; cursor: pointer;
                              background: var(--bs-secondary-bg); border: 1px solid var(--bs-border-color-translucent); border-radius: .45rem; font-size: .86rem; }
      details.sec[open] > summary { border-radius: .45rem .45rem 0 0; }
      details.sec > summary:hover { color: var(--bs-emphasis-color); }
      details.sec > .sec-bd { border: 1px solid var(--bs-border-color-translucent); border-top: 0; border-radius: 0 0 .45rem .45rem; background: var(--bs-body-bg); padding: .75rem; }
      /* content view switcher: plain links, active is bold+underlined */
      .vtabs { display: flex; gap: 1rem; align-items: baseline; }
      .vtabs a { color: var(--bs-secondary-color); font-size: .86rem; cursor: pointer; text-decoration: none; padding-bottom: 2px; }
      .vtabs a:hover { color: var(--bs-body-color); }
      .vtabs a.on { color: var(--bs-body-color); font-weight: 600; border-bottom: 2px solid var(--bs-primary); }
      /* who wrote it: the human is blue, an agent session green, the daemon quiet grey —
         light mode needs the mid-tone palette; *-text-emphasis is near-black there */
      .who-human { color: var(--bs-primary); }
      .who-agent { color: var(--bs-success); }
      .who-daemon { color: var(--bs-secondary-color); }
      [data-bs-theme="dark"] .who-human { color: var(--bs-primary-text-emphasis); }
      [data-bs-theme="dark"] .who-agent { color: var(--bs-success-text-emphasis); }
      /* notes: the author's colour runs down the left edge of their block */
      .note { border-left: .18rem solid var(--bs-border-color); padding-left: .7rem; margin-bottom: .9rem; }
      .note-human { border-left-color: var(--bs-primary); }
      .note-agent { border-left-color: var(--bs-success); }
      [data-bs-theme="dark"] .note-human { border-left-color: var(--bs-primary-text-emphasis); }
      [data-bs-theme="dark"] .note-agent { border-left-color: var(--bs-success-text-emphasis); }
      .note-by { font-size: .72rem; margin-bottom: .15rem; }
      /* graph: a scrollable zoom canvas; nodes open items on click */
      .graph-wrap { position: relative; }
      .graph-tools { position: absolute; top: .5rem; right: .5rem; z-index: 2; }
      .graph-drafts { position: absolute; top: .5rem; left: .5rem; z-index: 2; background: var(--bs-body-bg); opacity: .95; max-height: 60%; overflow: auto; }
      .graph-drafts .id { cursor: pointer; }
      .graph-view { overflow: auto; height: calc(100vh - 12rem); }
      /* zoom sizes a wrapper around the svg — a transform would grow it only
         visually, leaving nothing scrollable; flex:none because .card is a
         column flex box that would shrink the wrapper back to the view height */
      .graph-zoom { flex: none; width: calc(100% * var(--zoom, 1)); height: calc(100% * var(--zoom, 1)); }
      .graph-zoom svg { display: block; width: 100%; height: 100%; max-width: none !important; }
      .graph-view .node, .graph-view .node * { cursor: pointer; }
      .graph-view { cursor: grab; }
      .graph-view.dragging, .graph-view.dragging * { cursor: grabbing !important; user-select: none; }
      /* minimap under the zoom tools: whole-graph overview + the visible window */
      .graph-mini { position: absolute; top: 2.6rem; right: .5rem; z-index: 2; background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: .35rem; overflow: hidden; cursor: crosshair; opacity: .92; touch-action: none; }
      .graph-mini .mini-svg { position: absolute; top: 0; left: 0; transform-origin: top left; pointer-events: none; }
      .graph-mini .mini-svg svg { display: block; width: 100%; height: 100%; }
      .graph-mini .vp { position: absolute; border: 1.5px solid var(--bs-primary); background: rgba(13, 110, 253, .12); pointer-events: none; }
      /* the inbox's row size, reused by the plans tree and the archive list */
      .dense { font-size: .8rem; }
      /* inbox: one dense triage list — group headers, one line per item, actions on hover */
      /* the list itself is the grid and each row subgrids it, so the tag and action
         columns share one width across every row instead of sizing per row */
      .triage { display: grid; grid-template-columns: 5.6rem 6.4rem minmax(0, 1fr) auto auto auto; column-gap: .75rem; padding: 0 .75rem; background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: .5rem; overflow-x: auto; }
      .triage > div { display: contents; }
      .triage-group { grid-column: 1 / -1; margin: 0 -.75rem; display: flex; align-items: center; gap: .5rem; padding: .3rem .75rem; background: var(--bs-tertiary-bg); border-bottom: 1px solid var(--bs-border-color); font-size: .72rem; font-weight: 600; color: var(--bs-secondary-color); text-transform: uppercase; letter-spacing: .04em; min-width: 42rem; }
      .triage-group .n { font-weight: 500; color: var(--bs-tertiary-color); text-transform: none; font-variant-numeric: tabular-nums; }
      .triage-li { grid-column: 1 / -1; margin: 0 -.75rem; display: grid; grid-template-columns: subgrid; align-items: center; min-height: 2.2rem; padding: .25rem .75rem; border-bottom: 1px solid var(--bs-border-color-translucent); min-width: 42rem; font-size: .8rem; }
      .triage-li:last-child { border-bottom: 0; }
      .triage-li:hover, .triage-li:focus-within { background: var(--bs-secondary-bg); }
      .triage-li .id-cell, .triage-li .id, .triage-li .t { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      /* star sits at the id's midline, not on the baseline */
      .id-cell .item.id { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .id-cell > span { flex: none; display: inline-flex; align-items: center; }
      .triage-li .acts { display: flex; gap: .3rem; justify-self: end; opacity: 0; transition: opacity .12s; }
      .triage-li .age { justify-self: end; color: var(--bs-tertiary-color); font-variant-numeric: tabular-nums; }
      .triage-li:hover .acts, .triage-li:focus-within .acts { opacity: 1; }
      /* plans rows reuse the same reveal-on-hover pattern for their "graph" action */
      .plan-li .acts { display: flex; gap: .3rem; opacity: 0; transition: opacity .12s; }
      .plan-li:hover .acts, .plan-li:focus-within .acts { opacity: 1; }
      .triage-st { display: inline-flex; align-items: center; gap: .35rem; font-size: .72rem; color: var(--bs-secondary-color); white-space: nowrap; }
      .triage-st::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: var(--st, #6c757d); }
      .triage-sev { font-size: .64rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--bs-warning); white-space: nowrap; }
      .triage-sev.err { color: var(--bs-danger); }
      .triage-tag { display: inline-flex; align-items: center; gap: .28rem; height: 1.15rem; padding: 0 .4rem; border-radius: .25rem; font-size: .68rem; color: var(--bs-secondary-color); background: var(--bs-secondary-bg); white-space: nowrap; }
      .triage-tag i { width: .38rem; height: .38rem; border-radius: 50%; background: var(--c, #888); }
      .triage-detail { grid-column: 1 / -1; padding: .35rem 0 .5rem; border-top: 1px dashed var(--bs-border-color-translucent); white-space: normal; }
      /* search fields: × clear button inside the box (native one is webkit-only) */
      .search-box input { padding-right: 1.55rem; }
      .search-box input::-webkit-search-cancel-button { display: none; }
    </style>
  </head>
  <body>
    <nav class="navbar sticky-top border-bottom bg-body-tertiary px-3 py-0">
      <span class="navbar-brand fw-semibold me-4 py-0 d-flex align-items-center gap-2">
        <img src="/favicon.svg" alt="" width="24" height="24" /><span>TeamEngage&nbsp;<span class="text-secondary fw-normal" style="font-size:.7rem">__TE_VERSION__</span></span>
      </span>
      <div id="nav" class="nav nav-underline align-self-stretch flex-nowrap gap-3"></div>
      <button id="theme-toggle" class="icon-btn ms-auto" title="toggle theme">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 15A7 7 0 1 0 8 1v14zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16z"/>
        </svg>
      </button>
    </nav>
    <main id="app" class="container-fluid px-4 py-3"></main>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
